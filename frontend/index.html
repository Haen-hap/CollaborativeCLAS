      </div>
      <div id="panel"></div>
      <div id="modal"><div><span>¿Sigues ahí, amigo?</span><button class="btn" onclick="poke()">Sí, sigo aquí</button></div></div>
    </div>
    <script>
      (function () {
        var path = window.location.pathname || "/";
        var isReactRoute =
          path.startsWith("/datos") ||
          path.startsWith("/admin") ||
          path.startsWith("/qr");
        if (isReactRoute) {
          var ninaApp = document.getElementById("app");
          if (ninaApp) ninaApp.remove();
          document.body.style.overflow = "auto";
          document.body.style.display = "block";
        } else {
          var reactRoot = document.getElementById("root");
          if (reactRoot) reactRoot.remove();
          var link = document.createElement("link");
          link.rel = "stylesheet";
          link.href = "/css/styles.css";
          document.head.appendChild(link);
          ["/js/config.js", "/js/icons.js", "/js/audio.js", "/js/data.js", "/js/api.js", "/js/game.js"].forEach(function (src) {
            var s = document.createElement("script");
            s.src = src;
            s.async = false;
            document.body.appendChild(s);
          });
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
